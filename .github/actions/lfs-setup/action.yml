name: Git LFS Setup
description: >-
  Cache and pull Git LFS objects. Run it after actions/checkout with lfs set to false, so the cache restore comes before the download it exists to save.

runs:
  using: composite
  steps:
    - name: Create LFS file list
      shell: bash
      run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

    - name: Restore LFS cache
      uses: actions/cache@v6
      with:
        path: .git/lfs
        key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}
        restore-keys: |
          ${{ runner.os }}-lfs-

    - name: Pull LFS assets
      shell: bash
      run: git lfs pull
