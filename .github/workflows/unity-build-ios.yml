# This workflow builds the iOS player on pull requests to main.
# It exports the development Xcode project through IL2CPP from the iOS-Development Build Profile and uploads it as a build artifact.
# A development .ipa needs Apple signing, which the project does not have yet, so the export stops at the Xcode project.
# Release configuration is validated separately by unity-build-release-validation-ios.yml.
# It runs on a macOS runner because Unity's iOS export depends on Apple tooling.

name: Unity Build (iOS)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UNITY_VERSION: ${{ vars.UNITY_VERSION }}
  UNITY_CACHE_VERSION: ${{ vars.UNITY_CACHE_VERSION }}
  CI_FETCH_DEPTH: ${{ vars.CI_FETCH_DEPTH }}
  ARTIFACT_RETENTION_DAYS: ${{ vars.ARTIFACT_RETENTION_DAYS }}
  # Repository variable. Apple requires Xcode 26 for App Store uploads; keep it on a version the pinned macos-26 image ships (actions/runner-images).
  XCODE_VERSION: ${{ vars.XCODE_VERSION }}

jobs:
  build-ios:
    name: Build iOS Player
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ env.CI_FETCH_DEPTH }}
          lfs: false

      - name: Validate required CI variables
        uses: ./.github/actions/ci-preflight
        with:
          variables: UNITY_VERSION UNITY_CACHE_VERSION CI_FETCH_DEPTH ARTIFACT_RETENTION_DAYS XCODE_VERSION

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up Git LFS
        uses: ./.github/actions/lfs-setup

      - name: Build iOS player
        uses: ./.github/actions/unity-build
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          target-platform: iOS
          library-cache-prefix: Library-iOS
          unity-cache-version: ${{ env.UNITY_CACHE_VERSION }}
          unity-license: ${{ secrets.UNITY_LICENSE }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          cache-unity-installation-on-mac: "true"
          build-profile: Assets/Settings/Build Profiles/iOS-Development.asset
          artifact-name: iOS-Development-XcodeProject
          artifact-path: build/iOS
          log-artifact-name: iOS-Build-Logs
          artifact-retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
