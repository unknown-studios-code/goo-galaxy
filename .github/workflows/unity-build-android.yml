# This workflow builds the Android player on pull requests to main.
# It produces an installable development APK through IL2CPP from the Android-Development Build Profile and uploads it
# as a build artifact, proving the project and the profile still compile and package for the mobile target.
# Release configuration is validated separately by unity-build-release-validation-android.yml.

name: Unity Build (Android)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UNITY_VERSION: ${{ vars.UNITY_VERSION }}
  UNITY_CACHE_VERSION: ${{ vars.UNITY_CACHE_VERSION }}
  CI_FETCH_DEPTH: ${{ vars.CI_FETCH_DEPTH }}
  ARTIFACT_RETENTION_DAYS: ${{ vars.ARTIFACT_RETENTION_DAYS }}

jobs:
  build-android:
    name: Build Android Player
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ env.CI_FETCH_DEPTH }}
          lfs: false

      - name: Validate required CI variables
        uses: ./.github/actions/ci-preflight
        with:
          variables: UNITY_VERSION UNITY_CACHE_VERSION CI_FETCH_DEPTH ARTIFACT_RETENTION_DAYS

      - name: Set up Git LFS
        uses: ./.github/actions/lfs-setup

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: false

      - name: Build Android player
        uses: ./.github/actions/unity-build
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          target-platform: Android
          library-cache-prefix: Library-Android
          unity-cache-version: ${{ env.UNITY_CACHE_VERSION }}
          unity-license: ${{ secrets.UNITY_LICENSE }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          # Routes to the Android step only; with build-profile set the profile decides APK vs AAB (see the unity-build action).
          android-export-type: androidPackage
          build-profile: Assets/Settings/Build Profiles/Android-Development.asset
          artifact-name: Android-Development-APK
          artifact-path: build/Android
          log-artifact-name: Android-Build-Logs
          artifact-retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
