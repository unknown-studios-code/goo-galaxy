# This workflow executes Unity Edit Mode tests on pull requests to main.
# Edit Mode tests cover deterministic runtime logic and data validation without entering Play Mode.

name: Unity Tests (Edit Mode)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read

env:
  UNITY_VERSION: ${{ vars.UNITY_VERSION }}
  UNITY_CACHE_VERSION: ${{ vars.UNITY_CACHE_VERSION }}
  UNITY_COVERAGE_OPTIONS: ${{ vars.UNITY_COVERAGE_OPTIONS }}
  CI_FETCH_DEPTH: ${{ vars.CI_FETCH_DEPTH }}
  ARTIFACT_RETENTION_DAYS: ${{ vars.ARTIFACT_RETENTION_DAYS }}

jobs:
  unity-tests-editmode:
    name: Unity Edit Mode Tests
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ env.CI_FETCH_DEPTH }}
          lfs: false

      - name: Validate required CI variables
        uses: ./.github/actions/ci-preflight
        with:
          variables: UNITY_VERSION UNITY_CACHE_VERSION UNITY_COVERAGE_OPTIONS CI_FETCH_DEPTH ARTIFACT_RETENTION_DAYS

      - name: Set up Git LFS
        uses: ./.github/actions/lfs-setup

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0

      - name: Run Edit Mode tests
        uses: ./.github/actions/unity-test
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          test-mode: editmode
          library-cache-prefix: Library-Tests-EditMode
          unity-cache-version: ${{ env.UNITY_CACHE_VERSION }}
          unity-license: ${{ secrets.UNITY_LICENSE }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          check-name: Unity Edit Mode Test Results
          coverage-options: ${{ env.UNITY_COVERAGE_OPTIONS }}
          test-results-artifact-name: Test-Results-EditMode
          coverage-artifact-name: Coverage-Report-EditMode
          artifact-retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
