# This workflow scans the repository for leaked credentials on every push and weekly.
# It runs Betterleaks over the full history — not just the changed files — which is why
# it clones at full depth instead of reading the shared CI_FETCH_DEPTH variable.
# It also blocks files whose extension is secret-shaped, reusing the list from the push
# ruleset that GitHub itself cannot enforce on this plan.

name: Secret Scan

on:
  push:
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Block secret-shaped file extensions
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          extensions=$(jq -r '.rules[] | select(.type == "file_extension_restriction") | .parameters.restricted_file_extensions[]' .github/rulesets/push-rulesets/01-sensitive-files-protection.json)

          if [[ -n "$BASE_SHA" ]] &&
            [[ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] &&
            git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only --diff-filter=ACMR "${BASE_SHA}..${HEAD_SHA}")
            echo "Checking files changed in ${BASE_SHA}..${HEAD_SHA}"
          else
            changed=$(git ls-files)
            echo "No usable base commit; checking every tracked file"
          fi
          status=0
          for file in $changed; do
            for ext in $extensions; do
              if [[ "$file" == *"$ext" ]]; then
                echo "::error::Blocked '$file': restricted extension '$ext' (secret-shaped filename; see .github/rulesets/push-rulesets/01-sensitive-files-protection.json)"
                status=1
              fi
            done
          done
          exit $status

      - name: Run Betterleaks secret scan
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/betterleaks/betterleaks@sha256:16f903f0100ce7358ef1f870858777e55bec94cf04c6b65c45d013274ea3311c \
            git . --redact --verbose
