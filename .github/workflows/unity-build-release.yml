# This workflow produces signed, store-ready mobile builds from main.
# Android: an App Bundle signed with the upload keystore, versionCode = run_number * 10 + run_attempt.
# iOS: the Unity Xcode export from the iOS-Release Build Profile, archived and exported as an
# App Store Connect .ipa with manual signing, CFBundleVersion = the same build number.
# Signing files reach the runner only as base64 secrets (passwords as plain secrets) and are deleted
# when their step or job ends.

name: Unity Build (Release)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A running release is never cancelled mid-signing; a newer push waits for it (GitHub keeps only the
# newest pending run in the group).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UNITY_VERSION: ${{ vars.UNITY_VERSION }}
  UNITY_CACHE_VERSION: ${{ vars.UNITY_CACHE_VERSION }}
  CI_FETCH_DEPTH: ${{ vars.CI_FETCH_DEPTH }}
  ARTIFACT_RETENTION_DAYS: ${{ vars.ARTIFACT_RETENTION_DAYS }}
  # Apple requires Xcode 26 for App Store uploads. Must exist on the pinned macos-26 image (actions/runner-images).
  XCODE_VERSION: "26.6"

jobs:
  release-android:
    name: Signed Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release

    steps:
      - name: Validate required CI variables
        env:
          UNITY_VERSION: ${{ env.UNITY_VERSION }}
          UNITY_CACHE_VERSION: ${{ env.UNITY_CACHE_VERSION }}
          CI_FETCH_DEPTH: ${{ env.CI_FETCH_DEPTH }}
          ARTIFACT_RETENTION_DAYS: ${{ env.ARTIFACT_RETENTION_DAYS }}
        shell: bash
        run: |
          missing=0

          for variable_name in UNITY_VERSION UNITY_CACHE_VERSION CI_FETCH_DEPTH ARTIFACT_RETENTION_DAYS; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Missing required GitHub Actions variable: $variable_name" >&2
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      # Only whether each secret is set crosses into the shell, never its value.
      - name: Validate required signing secrets
        env:
          HAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS != '' }}
          HAS_ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME != '' }}
          HAS_ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS != '' }}
        shell: bash
        run: |
          missing=0

          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASS ANDROID_KEYALIAS_NAME ANDROID_KEYALIAS_PASS; do
            flag_name="HAS_$secret_name"
            if [[ "${!flag_name}" != "true" ]]; then
              echo "Missing required GitHub Actions secret: $secret_name" >&2
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      # run_number alone repeats on a re-run; the attempt digit keeps every upload unique.
      - name: Compute build number
        shell: bash
        run: |
          if (( GITHUB_RUN_ATTEMPT > 9 )); then
            echo "Run attempt $GITHUB_RUN_ATTEMPT would collide with the next run's build number." >&2
            exit 1
          fi

          echo "BUILD_NUMBER=$(( GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ env.CI_FETCH_DEPTH }}
          lfs: true

      - name: Create LFS file list
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: Pull LFS assets
        shell: bash
        run: git lfs pull

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: false

      # No build-profile here (see Validate build inputs in the unity-build action). Player Settings,
      # scenes and defines match Android-Release; the profile's own platform build settings do not
      # apply on this path, and debug symbols come from android-symbol-type.
      - name: Build signed Android App Bundle
        uses: ./.github/actions/unity-build
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          target-platform: Android
          library-cache-key: Library-Android-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ env.UNITY_CACHE_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          library-cache-restore-keys: |
            Library-Android-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ env.UNITY_CACHE_VERSION }}-
            Library-Android-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            Library-Android-${{ runner.os }}-
            Library-
          unity-license: ${{ secrets.UNITY_LICENSE }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          android-export-type: androidAppBundle
          android-version-code: ${{ env.BUILD_NUMBER }}
          android-symbol-type: public
          save-library-cache: "false"
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android-keystore-pass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          android-keyalias-name: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          android-keyalias-pass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          artifact-name: Android-Release
          artifact-path: build/Android
          log-artifact-name: Android-Release-Logs
          artifact-retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  release-ios:
    name: Signed iOS Build
    runs-on: macos-26
    timeout-minutes: 120
    environment: release
    # Job-level, so it resolves from the release environment as well as the repository.
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

    steps:
      - name: Validate required CI variables
        env:
          UNITY_VERSION: ${{ env.UNITY_VERSION }}
          UNITY_CACHE_VERSION: ${{ env.UNITY_CACHE_VERSION }}
          CI_FETCH_DEPTH: ${{ env.CI_FETCH_DEPTH }}
          ARTIFACT_RETENTION_DAYS: ${{ env.ARTIFACT_RETENTION_DAYS }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
        shell: bash
        run: |
          missing=0

          for variable_name in UNITY_VERSION UNITY_CACHE_VERSION CI_FETCH_DEPTH ARTIFACT_RETENTION_DAYS APPLE_TEAM_ID; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Missing required GitHub Actions variable: $variable_name" >&2
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      # Only whether each secret is set crosses into the shell, never its value.
      - name: Validate required signing secrets
        env:
          HAS_IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' }}
          HAS_IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD != '' }}
          HAS_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        shell: bash
        run: |
          missing=0

          for secret_name in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            flag_name="HAS_$secret_name"
            if [[ "${!flag_name}" != "true" ]]; then
              echo "Missing required GitHub Actions secret: $secret_name" >&2
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      # run_number alone repeats on a re-run; the attempt digit keeps every upload unique.
      - name: Compute build number
        shell: bash
        run: |
          if (( GITHUB_RUN_ATTEMPT > 9 )); then
            echo "Run attempt $GITHUB_RUN_ATTEMPT would collide with the next run's build number." >&2
            exit 1
          fi

          echo "BUILD_NUMBER=$(( GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ env.CI_FETCH_DEPTH }}
          lfs: true

      # Select XCODE_VERSION explicitly instead of trusting the image default; fail with the installed list if the image dropped it.
      - name: Select Xcode
        shell: bash
        run: |
          xcode_app="/Applications/Xcode_${XCODE_VERSION}.app"

          if [[ ! -d "$xcode_app" ]]; then
            echo "Xcode $XCODE_VERSION is not installed on this runner image ($xcode_app missing). Installed:" >&2
            ls -d /Applications/Xcode_*.app >&2
            exit 1
          fi

          sudo xcode-select -s "$xcode_app/Contents/Developer"
          xcodebuild -version
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Create LFS file list
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: Pull LFS assets
        shell: bash
        run: git lfs pull

      - name: Export iOS Xcode project
        uses: ./.github/actions/unity-build
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          target-platform: iOS
          library-cache-key: Library-iOS-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ env.UNITY_CACHE_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          library-cache-restore-keys: |
            Library-iOS-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ env.UNITY_CACHE_VERSION }}-
            Library-iOS-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            Library-iOS-${{ runner.os }}-
            Library-
          unity-license: ${{ secrets.UNITY_LICENSE }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          cache-unity-installation-on-mac: "true"
          build-profile: Assets/Settings/Build Profiles/iOS-Release.asset
          save-library-cache: "false"
          artifact-name: iOS-Release-XcodeProject
          artifact-path: build/iOS
          log-artifact-name: iOS-Release-Logs
          artifact-retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Locate Xcode project
        shell: bash
        run: |
          project_file="$(find build/iOS -maxdepth 4 -path '*/Unity-iPhone.xcodeproj/project.pbxproj' | head -n 1)"

          if [[ -z "$project_file" ]]; then
            echo "Unity-iPhone.xcodeproj not found under build/iOS." >&2
            exit 1
          fi

          echo "XCODE_PROJECT_DIR=$(cd "$(dirname "$project_file")/.." && pwd)" >> "$GITHUB_ENV"

      # A throwaway keychain with a random password; nothing is imported into the login keychain.
      - name: Import distribution certificate
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          certificate_path="$RUNNER_TEMP/distribution.p12"

          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"

          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$certificate_path"
          security import "$certificate_path" -k "$keychain_path" -f pkcs12 -t cert \
            -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$certificate_path"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" > /dev/null

          existing_keychains=()
          while IFS= read -r keychain; do
            existing_keychains+=("$keychain")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk 'NR == 1 && $2 ~ /^[0-9A-F]{40}$/ { print $2 }')"

          if [[ -z "$signing_identity" ]]; then
            echo "No valid code-signing identity found in the imported certificate." >&2
            exit 1
          fi

          echo "SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          profile_path="$RUNNER_TEMP/distribution.mobileprovision"
          profile_plist="$RUNNER_TEMP/distribution-profile.plist"

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          bundle_id="${application_identifier#*.}"

          if [[ "$profile_team" != "$APPLE_TEAM_ID" ]]; then
            echo "Provisioning profile team $profile_team does not match APPLE_TEAM_ID $APPLE_TEAM_ID." >&2
            exit 1
          fi

          if [[ "$bundle_id" == *"*"* ]]; then
            echo "Provisioning profile uses a wildcard App ID; App Store distribution needs an explicit one." >&2
            exit 1
          fi

          for profiles_dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$profiles_dir"
            cp "$profile_path" "$profiles_dir/$profile_uuid.mobileprovision"
          done

          rm -f "$profile_path" "$profile_plist"

          {
            echo "PROFILE_UUID=$profile_uuid"
            echo "BUNDLE_ID=$bundle_id"
          } >> "$GITHUB_ENV"

      - name: Configure Xcode project signing and build number
        shell: bash
        run: |
          project_file="$XCODE_PROJECT_DIR/Unity-iPhone.xcodeproj/project.pbxproj"

          plutil -convert xml1 "$project_file"
          python3 .github/ios/configure_signing.py "$project_file"

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$XCODE_PROJECT_DIR/Info.plist"

          if [[ -f "$XCODE_PROJECT_DIR/Podfile" && ! -d "$XCODE_PROJECT_DIR/Unity-iPhone.xcworkspace" ]]; then
            (cd "$XCODE_PROJECT_DIR" && pod install)
          fi

      - name: Archive iOS app
        shell: bash
        run: |
          if [[ -d "$XCODE_PROJECT_DIR/Unity-iPhone.xcworkspace" ]]; then
            container=(-workspace "$XCODE_PROJECT_DIR/Unity-iPhone.xcworkspace")
          else
            container=(-project "$XCODE_PROJECT_DIR/Unity-iPhone.xcodeproj")
          fi

          xcodebuild archive \
            "${container[@]}" \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GooGalaxy.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Export App Store .ipa
        shell: bash
        run: |
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cp .github/ios/ExportOptions.plist "$export_options"

          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c "Set :signingCertificate $SIGNING_IDENTITY" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_UUID" "$export_options"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GooGalaxy.xcarchive" \
            -exportOptionsPlist "$export_options" \
            -exportPath build/iOS-ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v7
        with:
          name: iOS-Release-IPA
          path: build/iOS-ipa/*.ipa
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi

          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/distribution-profile.plist"
