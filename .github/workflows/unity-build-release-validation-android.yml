# This workflow validates the Android release configuration without any release signing material.
# It builds an installable release APK (debug-signed, since no keystore is supplied) for performance measurements.
# Pull request builds are development builds; this is the scheduled check that the release configuration still
# compiles. The signed store build stays in unity-build-release-android.yml. Not a required status check.
# A scheduled run is skipped when main has not changed since this workflow last succeeded.

name: Unity Build (Android Release Validation)

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A manual dispatch must not kill a scheduled run that is already building, so nothing is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UNITY_VERSION: ${{ vars.UNITY_VERSION }}
  UNITY_CACHE_VERSION: ${{ vars.UNITY_CACHE_VERSION }}
  CI_FETCH_DEPTH: ${{ vars.CI_FETCH_DEPTH }}
  ARTIFACT_RETENTION_DAYS: ${{ vars.ARTIFACT_RETENTION_DAYS }}

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      changed: ${{ steps.gate.outputs.changed }}

    steps:
      # Only the composite actions are needed, so the checkout is sparse.
      - name: Checkout composite actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      # Skips the scheduled build when main has not moved since the last successful run of this workflow.
      # A manual dispatch always builds. If the lookup fails the job fails open and the build runs.
      - name: Compare with the last successful run
        id: gate
        uses: ./.github/actions/skip-if-unchanged
        with:
          workflow-file: unity-build-release-validation-android.yml
          github-token: ${{ github.token }}

  validate-android:
    name: Release Validation (Android)
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ env.CI_FETCH_DEPTH }}
          lfs: false

      - name: Validate required CI variables
        uses: ./.github/actions/ci-preflight
        with:
          variables: UNITY_VERSION UNITY_CACHE_VERSION CI_FETCH_DEPTH ARTIFACT_RETENTION_DAYS

      - name: Set up Git LFS
        uses: ./.github/actions/lfs-setup

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: false

      # No build-profile here, mirroring the signed release job: the release configuration comes from Player
      # Settings. android-export-type androidPackage makes the default build script emit an APK, whereas the
      # signed job ships an AAB, so bundle packaging is not exercised here. With no keystore supplied Unity
      # signs the APK with the debug key: installable, not store-ready.
      - name: Build release Android APK
        uses: ./.github/actions/unity-build
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          target-platform: Android
          library-cache-prefix: Library-Android
          unity-cache-version: ${{ env.UNITY_CACHE_VERSION }}
          unity-license: ${{ secrets.UNITY_LICENSE }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          android-export-type: androidPackage
          android-symbol-type: public
          artifact-name: Android-Release-APK
          artifact-path: build/Android
          log-artifact-name: Android-Release-Validation-Logs
          artifact-retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
